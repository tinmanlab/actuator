name: Actuator verification
on:
  push:
    branches: [main, feat/virtual-actuator-lab]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actuator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mujoco:
    name: Actual MuJoCo and render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned engine and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libosmesa6 ffmpeg
          python -m pip install -r examples/mujoco/requirements.txt
      - name: Build native boundary and generated geometry
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --parallel 2
      - name: Run actual-engine acceptance and record five scenarios
        run: python tools/verify_mujoco.py --backend osmesa --record --output results/mujoco_acceptance
      - name: Preserve reports and logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-evidence-${{ github.sha }}
          path: results/mujoco_acceptance/
          if-no-files-found: warn
          retention-days: 14
